<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E刻校园 - 华师大闵行校区智能导航</title>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" />
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-light: #eff6ff;
  --ink: #0f172a;
  --slate: #475569;
  --muted: #94a3b8;
  --line: #e2e8f0;
  --danger: #ef4444;
  --amber: #f59e0b;
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08);
  --shadow-md: 0 8px 28px rgba(15, 23, 42, 0.14);
  --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.22);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: #e8edf3;
  -webkit-font-smoothing: antialiased;
}
#map { width: 100vw; height: 100vh; }

/* 加载条 */
#loading-bar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 3px;
  z-index: 5000; background: linear-gradient(90deg, #2563eb, #7c3aed, #06b6d4, #2563eb);
  background-size: 200% 100%; animation: ld 1.4s linear infinite; }
@keyframes ld { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* 顶部品牌条 */
#brand-badge { position: fixed; top: 14px; left: 16px; z-index: 1000;
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.6);
  padding: 8px 16px 8px 10px; border-radius: 14px; box-shadow: var(--shadow-md); }
#brand-badge .logo { width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 18px; font-weight: 700; }
#brand-badge .name { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: 0.5px; }
#brand-badge .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

/* 搜索栏 */
#search-panel { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 1200; width: 460px; max-width: calc(100vw - 140px); }
#search-box { display: flex; align-items: center; background: rgba(255,255,255,0.96);
  backdrop-filter: blur(10px); border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-md); border: 1px solid rgba(255,255,255,0.7);
  transition: box-shadow .2s, transform .2s; }
#search-box:focus-within { box-shadow: 0 0 0 3px rgba(37,99,235,0.18), var(--shadow-md); }
#search-box .search-ico { padding-left: 16px; color: var(--muted); font-size: 15px; flex-shrink: 0; }
#search-input { flex: 1; border: none; padding: 15px 10px 15px 10px; font-size: 15px;
  outline: none; background: transparent; color: var(--ink); }
#search-input::placeholder { color: #a7b3c4; }
#search-btn { border: none; background: var(--primary); color: #fff; padding: 0 24px;
  font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
  align-self: stretch; transition: background .15s; }
#search-btn:hover { background: var(--primary-dark); }

#results-list { display: none; list-style: none; background: rgba(255,255,255,0.98);
  margin-top: 8px; border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-md); border: 1px solid rgba(255,255,255,0.7); }
#results-list li { padding: 13px 18px; cursor: pointer; display: flex;
  justify-content: space-between; align-items: center;
  border-bottom: 1px solid #f1f5f9; transition: background .12s; }
#results-list li:hover { background: var(--primary-light); }
#results-list li:last-child { border-bottom: none; }
.place-name { font-weight: 600; color: var(--ink); font-size: 15px; }
.place-detail { font-size: 12px; color: var(--muted); margin-top: 3px; }
.place-go { color: var(--primary); font-size: 12px; font-weight: 600;
  background: var(--primary-light); padding: 6px 12px; border-radius: 20px;
  transition: background .15s, color .15s; }
#results-list li:hover .place-go { background: var(--primary); color: #fff; }

/* 右侧按钮组 */
#toolbar { position: fixed; top: 88px; right: 14px; z-index: 1000;
  display: flex; flex-direction: column; gap: 10px; }
.side-btn { width: 46px; height: 46px; border: 1px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.94); backdrop-filter: blur(8px);
  border-radius: 14px; box-shadow: var(--shadow-sm);
  font-size: 19px; cursor: pointer; line-height: 46px; text-align: center;
  color: #334155; transition: all .16s ease; position: relative; }
.side-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); filter: brightness(0.96); }
.side-btn:active { transform: translateY(0); }
.side-btn::after { content: attr(data-tip); position: absolute; right: 58px; top: 50%;
  transform: translateY(-50%) scale(0.9); background: var(--ink); color: #fff;
  font-size: 12px; padding: 5px 10px; border-radius: 8px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
.side-btn:hover::after { opacity: 1; transform: translateY(-50%) scale(1); }
.side-btn.active { background: #fef08a; color: #854d0e; border-color: #eab308;
  box-shadow: 0 0 0 3px rgba(234,179,8,0.25), var(--shadow-sm); }
#toolbar .sep { height: 1px; background: rgba(148,163,184,0.25); margin: 2px 6px; }

/* 路线信息卡片 */
#route-info { display: none; position: fixed; bottom: 24px; left: 16px; z-index: 1200;
  background: rgba(255,255,255,0.97); backdrop-filter: blur(10px);
  border-radius: 18px; padding: 18px 22px; min-width: 210px;
  box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,0.7);
  animation: rise .25s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
#route-info .dist { font-size: 30px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
#route-info .dist small { font-size: 14px; font-weight: 600; color: var(--primary); margin-left: 3px; }
#route-info .time { font-size: 14px; color: var(--slate); margin-top: 5px; font-weight: 500; }
#route-info .time b { color: var(--ink); }
#route-info .close { position: absolute; top: 10px; right: 12px; background: #f1f5f9;
  border: none; width: 24px; height: 24px; border-radius: 8px; font-size: 14px;
  cursor: pointer; color: var(--muted); line-height: 24px; transition: background .15s, color .15s; }
#route-info .close:hover { background: #e2e8f0; color: var(--ink); }
#waypoints-list { margin-top: 10px; font-size: 13px; color: var(--slate); line-height: 1.6; }

/* 编辑弹窗 */
#edit-modal { display: none; position: fixed; inset: 0; z-index: 3000;
  background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(3px);
  justify-content: center; align-items: center; }
#edit-modal.show { display: flex; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
#edit-modal .card { background: #fff; border-radius: 20px; padding: 26px;
  width: 400px; max-width: 92vw; box-shadow: var(--shadow-lg);
  animation: pop .22s cubic-bezier(.2,.9,.3,1.2); }
@keyframes pop { from { opacity: 0; transform: scale(0.92) translateY(8px); } to { opacity: 1; transform: none; } }
#edit-modal .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
#edit-modal .card-head .ico { width: 34px; height: 34px; border-radius: 10px;
  background: var(--primary-light); color: var(--primary); display: flex;
  align-items: center; justify-content: center; font-size: 17px; }
#edit-modal h3 { font-size: 17px; color: var(--ink); }
#edit-modal label { font-size: 13px; color: var(--slate); display: block; margin: 14px 0 6px; font-weight: 500; }
#edit-modal input, #edit-modal textarea { width: 100%; padding: 10px 13px;
  border: 1.5px solid var(--line); border-radius: 11px; font-size: 14px; outline: none;
  color: var(--ink); background: #f8fafc; transition: border-color .15s, background .15s, box-shadow .15s; }
#edit-modal input:focus, #edit-modal textarea:focus { border-color: var(--primary);
  background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
#edit-modal textarea { resize: vertical; min-height: 56px; }
#edit-modal .btns { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }
#edit-modal .btns button { padding: 10px 22px; border-radius: 11px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
#edit-modal .btn-save { background: var(--primary); color: #fff; }
#edit-modal .btn-save:hover { background: var(--primary-dark); box-shadow: var(--shadow-sm); }
#edit-modal .btn-del { background: #fef2f2; color: var(--danger); margin-right: auto; }
#edit-modal .btn-del:hover { background: #fee2e2; }
#edit-modal .btn-cancel { background: #f1f5f9; color: var(--slate); }
#edit-modal .btn-cancel:hover { background: #e2e8f0; }

/* 地图控件下移，避开底部信息 */
.maplibregl-ctrl-bottom-right { bottom: 40px; }
.maplibregl-ctrl-group { box-shadow: var(--shadow-sm) !important; border-radius: 12px !important; overflow: hidden; }
.maplibregl-ctrl-group button { width: 34px !important; height: 34px !important; }

/* 响应式 */
@media (max-width: 720px) {
  #search-panel { width: calc(100vw - 24px); top: 12px; }
  #brand-badge { display: none; }
  #toolbar { top: 76px; right: 8px; }
  .side-btn { width: 42px; height: 42px; line-height: 42px; }
}
</style>
</head>
<body>

<div id="loading-bar"></div>
<div id="map"></div>

<div id="brand-badge">
  <div class="logo">走</div>
  <div>
    <div class="name">E刻校园</div>
    <div class="sub">华师大闵行校区 · 智能步行导航</div>
  </div>
</div>

<div id="search-panel">
  <div id="search-box">
    <span class="search-ico">🔍</span>
    <input id="search-input" placeholder="搜一搜: 打印成绩单 / 打篮球 / 补办校园卡..." autocomplete="off" />
    <button id="search-btn" onclick="doSearch()">搜索</button>
  </div>
  <ul id="results-list"></ul>
</div>

<div id="toolbar">
  <button class="side-btn" id="locate-btn" data-tip="定位" onclick="locateMe()">📍</button>
  <button class="side-btn" id="pick-btn" data-tip="手动选起点" onclick="manualPick()">🎯</button>
  <div class="sep"></div>
  <button class="side-btn" id="edit-btn" data-tip="编辑地点" onclick="toggleEdit()">✏️</button>
  <button class="side-btn" id="add-btn" data-tip="新增地点" onclick="startAddPlace()">➕</button>
  <div class="sep"></div>
  <button class="side-btn" id="reset-btn" data-tip="回正北" onclick="resetNorth()">🧭</button>
</div>

<div id="route-info">
  <button class="close" onclick="clearRoute()">✕</button>
  <div class="dist" id="route-dist"></div>
  <div class="time" id="route-time"></div>
  <div id="waypoints-list"></div>
</div>

<div id="edit-modal">
  <div class="card">
    <div class="card-head"><div class="ico">📍</div><h3 id="modal-title">编辑地点</h3></div>
    <label>名称</label><input id="edit-name" />
    <label>关键词 (用逗号分隔)</label><input id="edit-keywords" placeholder="图书馆, 借书, 自习" />
    <label>详情</label><textarea id="edit-detail" placeholder="开放时间、楼层等"></textarea>
    <div class="btns">
      <button class="btn-del" id="btn-delete" style="display:none" onclick="deletePlace()">删除</button>
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="savePlace()">保存</button>
    </div>
  </div>
</div>

<script>
// === 状态 ===
let userLat = null, userLng = null;
let editMode = false, addMode = false, editingId = null;
let routeSourceId = null, routeLayerId = null;
let destMarker = null;

// === 地图 (MapLibre GL JS, WGS-84) ===
const CAMPUS_BOUNDS = [[121.440, 31.024], [121.460, 31.042]];

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["/tiles/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "&copy; OpenStreetMap"
      }
    },
    layers: [{ id: "osm-tiles", type: "raster", source: "osm" }]
  },
  minZoom: 14,
  maxZoom: 19,
  maxBounds: CAMPUS_BOUNDS,
  dragRotate: true,           // 右键拖拽旋转
  touchZoomRotate: true,      // 触屏旋转
  pitchWithRotate: false,
  attributionControl: false
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

// === 遮罩 & 边界 ===
const OUTER = [[[-180, 90], [180, 90], [180, -90], [-180, -90]]];

// 校园边界坐标（内联，无加载延迟）
const BOUNDARY_COORDS = [[121.44155012757561, 31.036935492247935], [121.44652502794929, 31.025567695689997], [121.45295843325174, 31.027451008769802], [121.45052093186386, 31.033665677739222], [121.45776371070215, 31.03483849543867], [121.45727636309672, 31.037935863398225], [121.45284110000001, 31.037403], [121.45143389999997, 31.0399357], [121.44155012757561, 31.036935492247935]];

map.on("load", () => {
  // 1. 路网（底层）
  map.addSource("roadnet", {
    type: "geojson",
    data: "/data/ecnu_edges_merged.geojson"
  });
  map.addLayer({
    id: "roadnet-line", type: "line", source: "roadnet",
    paint: {
      "line-color": "#f87171",
      "line-width": 2,
      "line-opacity": 0.6
    }
  });

  // 2. 黑色遮罩（顶层，遮盖校外所有内容）
  map.addSource("mask", {
    type: "geojson",
    data: { type: "Polygon", coordinates: [OUTER[0], BOUNDARY_COORDS] }
  });
  map.addLayer({
    id: "mask-fill", type: "fill", source: "mask",
    paint: { "fill-color": "#000", "fill-opacity": 1 }
  });

  // 3. 边界线
  map.addSource("boundary", {
    type: "geojson",
    data: { type: "Polygon", coordinates: [BOUNDARY_COORDS] }
  });
  map.addLayer({
    id: "boundary-line", type: "line", source: "boundary",
    paint: { "line-color": "#2563eb", "line-width": 2, "line-dasharray": [4, 2] }
  });

  // 自适应屏幕
  const bounds = BOUNDARY_COORDS.reduce(
    (b, c) => b.extend(c),
    new maplibregl.LngLatBounds(BOUNDARY_COORDS[0], BOUNDARY_COORDS[0])
  );
  map.fitBounds(bounds, { padding: 30, maxZoom: 17, duration: 0 });
});

// === 工具 ===
function Ld() { document.getElementById("loading-bar").style.display = "block"; }
function Hd() { document.getElementById("loading-bar").style.display = "none"; }

// === 回正北 ===
function resetNorth() {
  map.easeTo({ bearing: 0, pitch: 0 });
}

// === 定位 ===
function locateMe() {
  const btn = document.getElementById("locate-btn");
  btn.textContent = "⏳";
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;

    // 更新或创建标记
    if (map.getSource("user-loc")) {
      map.getSource("user-loc").setData({
        type: "Point", coordinates: [userLng, userLat]
      });
    } else {
      map.addSource("user-loc", {
        type: "geojson",
        data: { type: "Point", coordinates: [userLng, userLat] }
      });
      map.addLayer({
        id: "user-dot", type: "circle", source: "user-loc",
        paint: { "circle-radius": 8, "circle-color": "#2563eb",
          "circle-stroke-width": 3, "circle-stroke-color": "#fff" }
      });
    }

    map.flyTo({ center: [userLng, userLat], zoom: 17 });
    btn.textContent = "📍";
  }, err => {
    alert("定位失败: " + err.message + "\n请用🎯手动选点");
    btn.textContent = "📍";
  }, { enableHighAccuracy: true, timeout: 10000 });
}

// === 通用取消 ===
let _pickMode = false;
let _addModeClick = null; // 存储 MapLibre click handler 引用

function cancelPickMode() {
  _pickMode = false;
  document.getElementById("pick-btn").style.background = "#fff";
  map.getCanvas().style.cursor = "";
}

function cancelAddMode() {
  if (_addModeClick) { map.off("click", _addModeClick); _addModeClick = null; }
  addMode = false;
  document.getElementById("add-btn").classList.remove("active");
  document.getElementById("add-btn").textContent = "➕";
  map.getCanvas().style.cursor = "";
}

// Esc 统一处理
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.getElementById("edit-modal").classList.contains("show")) {
      closeModal();
    } else if (_pickMode) {
      cancelPickMode();
    } else if (_addModeClick) {
      cancelAddMode();
    } else if (map.getSource("route")) {
      clearRoute();
    }
  }
});

// 右键取消
map.on("contextmenu", e => {
  if (_pickMode) { cancelPickMode(); }
  if (_addModeClick) { cancelAddMode(); }
});

// === 手动选点 ===
function manualPick() {
  if (editMode) return;

  // 再次点击取消
  if (_pickMode) { cancelPickMode(); return; }
  if (_addModeClick) { cancelAddMode(); }

  _pickMode = true;
  const btn = document.getElementById("pick-btn");
  btn.style.background = "#fef08a";
  map.getCanvas().style.cursor = "crosshair";

  map.once("click", function(e) {
    userLat = e.lngLat.lat;
    userLng = e.lngLat.lng;

    if (map.getSource("user-loc")) {
      map.getSource("user-loc").setData({ type: "Point", coordinates: [userLng, userLat] });
    } else {
      map.addSource("user-loc", { type: "geojson", data: { type: "Point", coordinates: [userLng, userLat] } });
      map.addLayer({ id: "user-dot", type: "circle", source: "user-loc",
        paint: { "circle-radius": 8, "circle-color": "#2563eb", "circle-stroke-width": 3, "circle-stroke-color": "#fff" } });
    }
    cancelPickMode();
  });
}

// === 搜索 ===
function doSearch() {
  const q = document.getElementById("search-input").value.trim();
  if (!q) return;
  const list = document.getElementById("results-list");
  Ld();
  fetch("/api/search?q=" + encodeURIComponent(q))
    .then(r => r.json()).then(data => {
      Hd(); list.innerHTML = "";
      if (!data.results.length) {
        list.innerHTML = '<li style="color:#94a3b8;justify-content:center;">没找到</li>';
        list.style.display = "block"; return;
      }
      data.results.forEach(p => {
        const li = document.createElement("li");
        li.innerHTML = `<div><div class="place-name">${p.name}</div><div class="place-detail">${p.detail}</div></div><span class="place-go">去这里 →</span>`;
        li.onclick = () => goTo(p);
        list.appendChild(li);
      });
      list.style.display = "block";
    }).catch(e => { Hd(); alert("请求失败，请检查网络连接"); });
}

document.getElementById("search-input").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
document.addEventListener("click", e => { if (!e.target.closest("#search-panel")) document.getElementById("results-list").style.display = "none"; });

// === 导航 ===
function goTo(place) {
  document.getElementById("results-list").style.display = "none";
  document.getElementById("search-input").value = place.name;
  if (userLat == null) { alert("请先定位📍或手动选点🎯"); return; }

  // 目的地标记
  if (map.getSource("dest")) map.removeLayer("dest-label").removeSource("dest");
  map.addSource("dest", {
    type: "geojson",
    data: { type: "Point", coordinates: [place.lng, place.lat] }
  });
  map.addLayer({
    id: "dest-label", type: "circle", source: "dest",
    paint: { "circle-radius": 10, "circle-color": "#e74c3c",
      "circle-stroke-width": 3, "circle-stroke-color": "#fff" }
  });

  Ld();
  fetch(`/api/route?from_lat=${userLat}&from_lng=${userLng}&to_lat=${place.lat}&to_lng=${place.lng}`)
    .then(r => r.json()).then(data => {
      Hd();
      if (data.error) { alert("路径规划失败: " + data.error); return; }

      // 路线
      if (map.getSource("route")) { map.removeLayer("route-line"); map.removeSource("route"); }
      map.addSource("route", {
        type: "geojson",
        data: { type: "Feature", geometry: data.route }
      });
      map.addLayer({
        id: "route-line", type: "line", source: "route",
        paint: { "line-color": "#2563eb", "line-width": 5, "line-opacity": 0.8 },
        layout: { "line-cap": "round", "line-join": "round" }
      });

      // 缩放到路线
      const coords = data.route.coordinates;
      const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
      map.fitBounds(bounds, { padding: 80 });

      document.getElementById("route-dist").textContent = data.distance_km + " 公里";
      document.getElementById("route-time").textContent = "约 " + data.time_min + " 分钟 · " + data.distance_m + " 米";
      document.getElementById("route-info").style.display = "block";
    }).catch(e => { Hd(); alert("请求失败，请检查网络连接"); });
}

function clearRoute() {
  ["route-line", "dest-label"].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  ["route", "dest"].forEach(id => { if (map.getSource(id)) map.removeSource(id); });
  document.getElementById("route-info").style.display = "none";
  document.getElementById("search-input").value = "";
}

map.on("click", e => {
  if (!map.getSource("route")) return;
  const canvas = e.originalEvent.target;
  if (canvas.closest(".maplibregl-popup") || canvas.closest("#search-panel") ||
      canvas.closest("#route-info") || canvas.closest(".side-btn") ||
      canvas.closest("#edit-modal")) return;
  clearRoute();
});


// === 编辑模式 ===
function toggleEdit() {
  editMode = !editMode;
  const btn = document.getElementById("edit-btn");
  if (editMode) {
    if (addMode) startAddPlace();
    btn.classList.add("active"); btn.textContent = "💾";
    loadPlaceMarkers();
  } else {
    btn.classList.remove("active"); btn.textContent = "✏️";
    clearPlaceMarkers();
  }
}

let _placeMarkerEls = [];

function loadPlaceMarkers() {
  fetch("/api/places").then(r => r.json()).then(data => {
    data.places.forEach(p => {
      const el = document.createElement("div");
      el.innerHTML = `<div style="background:#f59e0b;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px;white-space:nowrap;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,0.3);cursor:grab">${p.name}</div>`;
      el.style.cursor = "grab";
      el.title = "拖拽移动 · 双击编辑";

      const marker = new maplibregl.Marker({ element: el, draggable: true })
        .setLngLat([p.lng, p.lat])
        .addTo(map);

      marker.on("dragend", () => {
        const pos = marker.getLngLat();
        fetch("/api/places/" + p.id + "/move", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat: pos.lat, lng: pos.lng })
        });
      });

      el.addEventListener("dblclick", () => openEdit(p.id));

      marker._placeId = p.id;
      _placeMarkerEls.push(marker);
    });
    console.log("编辑模式: " + data.places.length + " 个地点");
  });
}

function clearPlaceMarkers() {
  _placeMarkerEls.forEach(m => m.remove());
  _placeMarkerEls = [];
}

// === 新增地点 ===
function startAddPlace() {
  if (editMode) toggleEdit();

  // 再次点击取消
  if (_addModeClick) { cancelAddMode(); return; }
  if (_pickMode) { cancelPickMode(); }

  const btn = document.getElementById("add-btn");
  addMode = true;
  btn.classList.add("active"); btn.textContent = "🎯";
  map.getCanvas().style.cursor = "crosshair";

  _addModeClick = function(e) {
    editingId = null;
    document.getElementById("modal-title").textContent = "新增地点";
    document.getElementById("edit-name").value = "";
    document.getElementById("edit-keywords").value = "";
    document.getElementById("edit-detail").value = "";
    document.getElementById("btn-delete").style.display = "none";
    document.getElementById("edit-modal").classList.add("show");
    document.getElementById("edit-modal").dataset.lat = e.lngLat.lat;
    document.getElementById("edit-modal").dataset.lng = e.lngLat.lng;
    cancelAddMode();
  };
  map.on("click", _addModeClick);
}

// === 编辑弹窗 ===
function openEdit(placeId) {
  fetch("/api/places").then(r => r.json()).then(data => {
    const p = data.places.find(x => x.id === placeId);
    if (!p) return;
    editingId = placeId;
    document.getElementById("modal-title").textContent = "编辑: " + p.name;
    document.getElementById("edit-name").value = p.name;
    document.getElementById("edit-keywords").value = p.keywords.join(",");
    document.getElementById("edit-detail").value = p.detail || "";
    document.getElementById("btn-delete").style.display = "block";
    document.getElementById("edit-modal").classList.add("show");
  });
}

function closeModal() {
  document.getElementById("edit-modal").classList.remove("show");
  editingId = null;
}

function savePlace() {
  const name = document.getElementById("edit-name").value.trim();
  const kwStr = document.getElementById("edit-keywords").value.trim();
  const detail = document.getElementById("edit-detail").value.trim();
  if (!name) return alert("名称不能为空");
  const keywords = kwStr ? kwStr.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [name];

  if (editingId) {
    fetch("/api/places/" + editingId, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, keywords, detail })
    }).then(r => r.json()).then(d => {
      if (d.ok) { closeModal(); if (editMode) { clearPlaceMarkers(); loadPlaceMarkers(); } }
    });
  } else {
    const lat = parseFloat(document.getElementById("edit-modal").dataset.lat);
    const lng = parseFloat(document.getElementById("edit-modal").dataset.lng);
    if (isNaN(lat) || isNaN(lng)) { alert("请先在地图上点击选择位置"); return; }
    fetch("/api/places", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, keywords, detail, lat, lng })
    }).then(r => r.json()).then(d => {
      if (d.ok) { closeModal(); if (editMode) { clearPlaceMarkers(); loadPlaceMarkers(); } }
    });
  }
}

function deletePlace() {
  if (!editingId || !confirm("确定删除「" + document.getElementById("edit-name").value + "」?")) return;
  fetch("/api/places/" + editingId, { method: "DELETE" })
    .then(r => r.json()).then(d => {
      if (d.ok) { closeModal(); if (editMode) { clearPlaceMarkers(); loadPlaceMarkers(); } }
    });
}

document.getElementById("edit-modal").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});
